name: astrbot_plugin_reply_trim
display_name: 回复整形（去空白 + 分段发送）
author: q1w2e3r4t5y6658
version: 1.6.1
short_desc: 去掉回复首尾空白，并按标点把长回复拆成几条依次发出
desc: |
  把机器人的一条回复整理成更像真人聊天的形式：
  1）去掉首尾多余的空白与换行（LLM 自己吐的换行 + AstrBot @ 后加的换行）；
  2）按「。？！」与换行把长回复拆成几条，间隔一小段随机时间依次发出；
  3）短句（语气词、拟声词）并到后一句前面，括号里的动作描写并到后面的台词前面；
  4）模型夹带的花括号状态标记（如 {mood: happy}）直接不发给用户。
  支持群聊/私聊分别开关、会话黑名单、私聊「正在输入」、代码与引号保护、分段规则全可调。
repo: https://github.com/q1w2e3r4t5y6658/astrbot_plugin_reply_trim
astrbot_version: ">=4.0,<5"
support_platforms:
  - aiocqhttp
social_link: https://github.com/q1w2e3r4t5y6658
